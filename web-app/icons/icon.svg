<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a6c"/>
      <stop offset="100%" style="stop-color:#2c5fa8"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="102" fill="url(#bg)"/>
  
  <!-- Scale of Justice -->
  <g transform="translate(256, 256)">
    <!-- Central pillar -->
    <rect x="-15" y="-80" width="30" height="200" fill="#ffffff" rx="5"/>
    
    <!-- Base -->
    <ellipse cx="0" cy="130" rx="80" ry="20" fill="#e8a020"/>
    <rect x="-80" y="110" width="160" height="30" fill="#e8a020" rx="5"/>
    
    <!-- Top beam -->
    <rect x="-130" y="-100" width="260" height="20" fill="#ffffff" rx="10"/>
    
    <!-- Left scale pan -->
    <g transform="translate(-100, 0)">
      <line x1="0" y1="-90" x2="0" y2="20" stroke="#ffffff" stroke-width="4"/>
      <ellipse cx="0" cy="30" rx="50" ry="15" fill="#e8a020"/>
      <path d="M-50,30 Q-55,50 -45,70 L45,70 Q55,50 50,30 Z" fill="#d4940a" opacity="0.8"/>
    </g>
    
    <!-- Right scale pan -->
    <g transform="translate(100, 0)">
      <line x1="0" y1="-90" x2="0" y2="-10" stroke="#ffffff" stroke-width="4"/>
      <ellipse cx="0" cy="0" rx="50" ry="15" fill="#e8a020"/>
      <path d="M-50,0 Q-55,20 -45,40 L45,40 Q55,20 50,0 Z" fill="#d4940a" opacity="0.8"/>
    </g>
    
    <!-- Decorative top -->
    <circle cx="0" cy="-100" r="20" fill="#e8a020"/>
  </g>
  
  <!-- Text "0H" -->
  <text x="256" y="440" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="#ffffff" text-anchor="middle">0H</text>
</svg>
